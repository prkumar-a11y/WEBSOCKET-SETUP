<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold Necklace Auction</title>
<style>:root{font-family:system-ui,sans-serif;color:#33251a;background:#fff7ed}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.panel{background:#fff;border:1px solid #efd4ae;border-radius:14px;padding:22px;box-shadow:0 8px 24px #6b35151a}h1{margin:0;color:#a45108}.meta{color:#80664d}.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px}.amount{font-size:40px;font-weight:700;color:#d97706}.timer{font-size:28px;font-weight:700;color:#b45309}.book{margin-top:18px;height:260px;overflow:auto}.row{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #f4e4d0}.row strong{color:#b45309}.feed{height:170px;overflow:auto;background:#fff9f0;padding:12px;margin-top:16px;white-space:pre-wrap;font:13px ui-monospace,monospace}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:16px}input,button{padding:11px;border:1px solid #e5c9a8;border-radius:8px;font:inherit}button{background:#d97706;color:white;border:0;cursor:pointer}.winner{padding:14px;margin-top:16px;background:#fff0c7;border-radius:8px;color:#895000}@media(max-width:650px){.hero,.form{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="panel"><h1>Gold Necklace Auction</h1><p class="meta">Live auction starting at ₹50,000. Simulated users place bids every 2 seconds.</p><div class="hero"><div><div>Highest bid</div><div id="highest" class="amount">₹50,000</div><div id="bidder">Starting bid</div></div><div><div>Auction closes in</div><div id="timer" class="timer">02:00</div><div id="status">Connecting...</div></div></div><div class="form"><input id="bidderInput" value="You" aria-label="Bidder name"><input id="amountInput" type="number" value="51000" min="50001" aria-label="Bid amount"><button id="place">Place bid</button></div><div class="book"><h2>Live Bid History</h2><div id="bids"></div></div><div id="winner"></div><div id="feed">Connecting...</div></section></main>
<script>const base='/bidding';const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${base}`);const feed=document.querySelector('#feed');let endsAt=0;async function parseMessage(data){return JSON.parse(typeof data==='string'?data:await data.text())}function log(text){feed.textContent=`${new Date().toLocaleTimeString()}  ${text}\n`+feed.textContent}function money(value){return `₹${Number(value).toLocaleString('en-IN')}`}function renderWinner(value){winner.innerHTML=value?`<div class="winner">Winner: <strong>${value.bidder}</strong> at <strong>${money(value.amount)}</strong></div>`:'<div class="winner">No bids were placed.</div>'}function render(d){highest.textContent=money(d.auction.currentBid);bidder.textContent=d.auction.highestBidder||'Starting bid';status.textContent=d.auction.status.toUpperCase();endsAt=new Date(d.auction.endsAt).getTime();bids.innerHTML=d.bids.slice().reverse().map(b=>`<div class="row"><span>#${b.sequence} ${b.bidder}</span><strong>${money(b.amount)}</strong></div>`).join('');if(d.auction.status==='closed')renderWinner(d.winner)}function tick(){const seconds=Math.max(0,Math.ceil((endsAt-Date.now())/1000));timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}setInterval(tick,250);ws.onopen=()=>log('Connected - auction stream started');ws.onmessage=async e=>{const d=await parseMessage(e.data);if(d.type==='auction-snapshot'){bids.dataset.bids=JSON.stringify(d.bids);render(d);if(d.auction.status==='closed')log(d.winner?`Auction closed. Winner: ${d.winner.bidder}`:'Auction closed without bids')}else if(d.type==='bid-update'){const history=[...JSON.parse(bids.dataset.bids||'[]'),d.bid];bids.dataset.bids=JSON.stringify(history);render({auction:d.auction,bids:history});log(`${d.bid.bidder} bid ${money(d.bid.amount)} (#${d.bid.sequence})`)}else if(d.type==='auction-closed'){status.textContent='CLOSED';renderWinner(d.winner);log(d.winner?`Winner notification: ${d.winner.bidder}`:'Auction closed without bids')}else if(d.type==='bid-error'||d.type==='help')log(d.text)};place.onclick=()=>ws.send(JSON.stringify({type:'place-bid',bidder:bidderInput.value,amount:Number(amountInput.value)}));</script></body></html>
