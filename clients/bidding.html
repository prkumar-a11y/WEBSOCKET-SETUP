<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Bidding Platform</title>
<style>
body{font:16px system-ui;margin:0;background:#fff7ed;color:#2d2118}.wrap{max-width:900px;margin:40px auto;padding:24px}.panel{background:#fff;border:1px solid #f0d6b5;border-radius:14px;padding:24px;box-shadow:0 8px 24px #6b351512}h1{margin-top:0;color:#b45309}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{padding:11px;border:1px solid #e5c9a8;border-radius:8px;font:inherit}button{background:#d97706;color:#fff;border:0;cursor:pointer}#feed{min-height:220px;margin:20px 0;padding:14px;background:#fff9f0;border-radius:10px;white-space:pre-wrap}.meta{color:#80664d;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><section class="panel"><h1>Live Bidding Platform</h1><p class="meta">Watch bids arrive and publish test auction activity in real time.</p><div id="feed">Connecting...</div><div class="grid"><input id="auctionId" value="AUCTION-42" aria-label="Auction ID"><input id="bid" value="125" aria-label="Bid amount"><button id="send">Place bid</button><button id="help">Help</button></div></section></main>
<script>
const base=location.pathname.startsWith('/bidding')?'/bidding':'';const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${base}`);const feed=document.querySelector('#feed');
function line(text){feed.textContent=`${new Date().toLocaleTimeString()}  ${text}\n`+feed.textContent} async function parseMessage(data){return JSON.parse(typeof data==='string'?data:await data.text())}
ws.onopen=()=>line('Connected');ws.onmessage=async e=>{const d=await parseMessage(e.data);if(d.type==='snapshot')line(`Snapshot loaded (${d.state.events.length} bids)`);else if(d.type==='help')line(d.text);else if(d.type==='bid-update')line(`${d.event.auctionId||'auction'}: bid ${d.event.amount||'updated'}`)};
document.querySelector('#send').onclick=()=>ws.send(JSON.stringify({type:'event',event:{auctionId:auctionId.value,amount:Number(bid.value),action:'new-bid'}}));document.querySelector('#help').onclick=()=>ws.send(JSON.stringify({type:'help'}));
</script></body></html>
