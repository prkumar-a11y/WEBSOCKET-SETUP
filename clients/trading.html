<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Dashboard</title>
	<style>
		:root{font-family:system-ui,sans-serif;color:#e8f0f2;background:#0b1116}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px}h1{margin:0;color:#56d6b1}.meta{color:#9ab0b8}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{background:#132027;border:1px solid #2d414a;border-radius:12px;padding:18px}.markets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.market{background:#0d171c;border-radius:9px;padding:14px}.symbol{color:#9ab0b8}.last{font-size:27px;font-weight:700}.book{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font:12px ui-monospace,monospace}.book h3{font:600 13px system-ui;margin:0 0 5px}.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #20323a}.sell{color:#f59e9e}.buy{color:#75e3bd}.feed{height:175px;overflow:auto;white-space:pre-wrap;background:#0d171c;padding:12px;border-radius:8px;font:12px ui-monospace,monospace;color:#b9f4df}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}input,select,button{padding:10px;border:1px solid #405762;border-radius:7px;background:#0e171c;color:#e8f0f2;font:inherit}button{background:#198f78;border:0;cursor:pointer}.portfolio strong{font-size:23px;color:#56d6b1}.portfolio div{margin:8px 0;color:#b8cbd0}.alert{margin-top:8px;color:#ffd479}@media(max-width:800px){.grid{grid-template-columns:1fr}.markets{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
	</style>
</head>
<body><main class="wrap"><h1>Trading Dashboard</h1><p class="meta">Live BTC and ETH prices, order book depth, trades, portfolio, and threshold alerts.</p><section class="grid"><div class="panel"><h2>Live Markets</h2><div id="markets" class="markets"></div></div><aside class="panel portfolio"><h2>Portfolio</h2><div>Equity <strong id="equity">$100,000.00</strong></div><div>Cash <strong id="cash">$100,000.00</strong></div><div>BTC position <strong id="btcPosition">0</strong></div><div>ETH position <strong id="ethPosition">0</strong></div><div id="alerts" class="alert"></div></aside><section class="panel"><h2>Orders and Alerts</h2><div class="form"><select id="orderSymbol"><option>BTC</option><option>ETH</option></select><select id="orderSide"><option>buy</option><option>sell</option></select><input id="orderQuantity" type="number" min="0.0001" step="0.0001" value="0.01"><button id="execute">Execute order</button><select id="alertSymbol"><option>BTC</option><option>ETH</option></select><select id="alertDirection"><option>above</option><option>below</option></select><input id="alertThreshold" type="number" value="68000"><button id="setAlert">Set threshold alert</button></div></section><section class="panel"><h2>Live Event Stream</h2><div id="feed" class="feed">Connecting...</div></section></section></main>
<script>
const base=location.pathname.startsWith('/trading')?'/trading':'';const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${base}`);const marketsEl=document.querySelector('#markets');const feed=document.querySelector('#feed');
async function parseMessage(data){return JSON.parse(typeof data==='string'?data:await data.text())}function log(text){feed.textContent=`${new Date().toLocaleTimeString()}  ${text}\n`+feed.textContent}
function renderMarkets(markets){marketsEl.innerHTML=Object.values(markets).map(m=>`<article class="market"><div class="symbol">${m.symbol}/USD</div><div class="last">$${m.last.toLocaleString()}</div><div class="book"><div><h3 class="buy">BUY / BID</h3>${m.book.bids.map(row=>`<div class="row buy"><span>${row.quantity}</span><span>${row.price}</span></div>`).join('')}</div><div><h3 class="sell">SELL / ASK</h3>${m.book.asks.map(row=>`<div class="row sell"><span>${row.price}</span><span>${row.quantity}</span></div>`).join('')}</div></div></article>`).join('')}
function renderPortfolio(p){equity.textContent=`$${p.equity.toLocaleString(undefined,{minimumFractionDigits:2})}`;cash.textContent=`$${p.cash.toLocaleString(undefined,{minimumFractionDigits:2})}`;btcPosition.textContent=p.positions.BTC;ethPosition.textContent=p.positions.ETH}
ws.onopen=()=>log('Connected - live stream started');ws.onmessage=async e=>{const d=await parseMessage(e.data);if(d.type==='trading-snapshot'){renderMarkets(d.markets);renderPortfolio(d.portfolio);log('Snapshot loaded: BTC/ETH markets and portfolio')}else if(d.type==='market-update'){renderMarkets(d.markets)}else if(d.type==='order-status'){log(`${d.order.id} ${d.order.symbol} ${d.order.side} -> ${d.order.status}`)}else if(d.type==='portfolio-update'){renderPortfolio(d.portfolio);log(`Portfolio updated after ${d.trade.id}`)}else if(d.type==='price-alert'){log(`ALERT: ${d.symbol} crossed ${d.threshold} at ${d.price}`);alerts.textContent=`Alert: ${d.symbol} crossed ${d.threshold}`}else if(d.type==='alert-created'){log(`Alert set: ${d.alert.symbol} ${d.alert.direction} ${d.alert.threshold}`)}else if(d.type==='help'||d.type==='error')log(d.text)};
execute.onclick=()=>ws.send(JSON.stringify({type:'execute-order',order:{symbol:orderSymbol.value,side:orderSide.value,quantity:Number(orderQuantity.value)}}));setAlert.onclick=()=>ws.send(JSON.stringify({type:'set-alert',symbol:alertSymbol.value,direction:alertDirection.value,threshold:Number(alertThreshold.value)}));
</script></body></html>
