<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce Live Updates</title>
<style>
body{font:16px system-ui;margin:0;background:#f6f7f2;color:#18231b}.wrap{max-width:1000px;margin:40px auto;padding:24px}.panel{background:#fff;border:1px solid #d9e1d8;border-radius:14px;padding:24px;box-shadow:0 8px 24px #253b2b12}h1{margin-top:0;color:#176b45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,button{padding:11px;border:1px solid #cbd7cd;border-radius:8px;font:inherit}button{background:#176b45;color:#fff;border:0;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card{padding:14px;border-radius:10px;background:#f3f8f2}.card strong{display:block;font-size:22px;color:#176b45}.card small{color:#627064}#feed{min-height:220px;margin:20px 0;padding:14px;background:#18231b;color:#e6f4e8;border-radius:10px;white-space:pre-wrap}.meta{color:#627064;font-size:14px}@media(max-width:650px){.grid,.cards{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><section class="panel"><h1>E-Commerce Live Updates</h1><p class="meta">Customers receive inventory, price, and order changes instantly without refreshing.</p><div class="cards"><div class="card"><small>Inventory</small><strong id="inventoryValue">-</strong><span id="inventoryProduct">Waiting for update</span></div><div class="card"><small>Price drop</small><strong id="priceValue">-</strong><span id="priceProduct">Waiting for update</span></div><div class="card"><small>Order status</small><strong id="orderValue">-</strong><span id="orderId">Waiting for update</span></div></div><div id="feed">Connecting...</div><div class="grid"><select id="eventType" aria-label="Update type"><option value="inventory">Inventory change</option><option value="price-drop">Price drop</option><option value="order-status">Order status</option></select><input id="productId" value="SKU-1001" aria-label="Product or order ID"><input id="value" value="42" aria-label="Update value"><button id="send">Publish update</button><button id="help">Help</button></div></section></main>
<script>
const base='/ecommerce';const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${base}`);const feed=document.querySelector('#feed');
function line(text){feed.textContent=`${new Date().toLocaleTimeString()}  ${text}\n`+feed.textContent} async function parseMessage(data){return JSON.parse(typeof data==='string'?data:await data.text())}
function render(event){const id=event.productId||event.orderId||'item';if(event.type==='inventory'){inventoryValue.textContent=event.quantity??event.inventory??'-';inventoryProduct.textContent=id;line(`${id}: inventory ${event.quantity??event.inventory}`)}if(event.type==='price-drop'){priceValue.textContent=`$${event.price}`;priceProduct.textContent=id;line(`${id}: price dropped to $${event.price}`)}if(event.type==='order-status'){orderValue.textContent=event.status;orderId.textContent=event.orderId||id;line(`${event.orderId||id}: ${event.status}`)}}
ws.onopen=()=>line('Connected - waiting for live updates');ws.onmessage=async e=>{const d=await parseMessage(e.data);if(d.type==='snapshot'){line(`Snapshot loaded (${d.state.events.length} events)`);d.state.events.slice().reverse().forEach(render)}else if(d.type==='help')line(d.text);else if(d.type==='error')line(`Error: ${d.text}`);else if(d.type==='product-update')render(d.event)};
document.querySelector('#send').onclick=()=>{const type=eventType.value;const id=productId.value.trim();const raw=value.value.trim();const event=type==='inventory'?{type,productId:id,quantity:Number(raw)}:type==='price-drop'?{type,productId:id,price:Number(raw)}:{type,orderId:id,status:raw};ws.send(JSON.stringify({type:'event',event}))};document.querySelector('#help').onclick=()=>{window.location.href='/help'};
</script></body></html>
