<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chat Room</title><style>
:root{font-family:system-ui,sans-serif;color:#152238;background:#eef3f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.panel{background:#fff;border:1px solid #d6e0ea;border-radius:14px;padding:20px;box-shadow:0 8px 24px #1d355712}h1{margin:0;color:#1d4ed8}.meta{color:#607184}.layout{display:grid;grid-template-columns:240px 1fr;gap:16px}.users,.chat{background:#fff;border:1px solid #d6e0ea;border-radius:12px;padding:16px}.users h2,.chat h2{margin-top:0}.user{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f5}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e}.typing{color:#64748b;font-size:13px;min-height:20px}.messages{height:390px;overflow:auto;background:#f8fbff;border-radius:9px;padding:12px}.message{padding:10px;margin-bottom:9px;border-radius:9px;background:#e7f0ff}.message.system{background:#fff4d6;color:#7c5900}.message .receipt{float:right;color:#64748b;font-size:11px}.controls{display:grid;grid-template-columns:160px 1fr auto auto;gap:8px;margin-top:12px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd6e2}button{background:#1d4ed8;color:#fff;border:0;cursor:pointer}.secondary{background:#64748b}.notice{min-height:22px;color:#b45309;font-size:13px;margin-top:8px}@media(max-width:700px){.layout{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}
</style></head><body><main class="wrap"><section class="panel"><h1>Live Chat Room</h1><p class="meta">Five simulated users join, type, and send messages every 3 seconds. Messages stay ordered and expose delivery receipts.</p><div class="layout"><aside class="users"><h2>Participants</h2><div id="userList"></div></aside><section class="chat"><h2>Conversation</h2><div id="typing" class="typing"></div><div id="messages" class="messages"></div><div id="notice" class="notice"></div><div class="controls"><input id="username" value="BrowserUser" aria-label="Username"><input id="messageInput" placeholder="Write a message..." aria-label="Message"><button id="send">Send</button><button id="help" class="secondary">Help</button></div></section></div></section></main><script>
const base=location.pathname.startsWith('/chat')?'/chat':'';const socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}${base}`);const messagesEl=document.querySelector('#messages');const userList=document.querySelector('#userList');const typingEl=document.querySelector('#typing');const noticeEl=document.querySelector('#notice');const messageInput=document.querySelector('#messageInput');const usernameInput=document.querySelector('#username');const receipts=new Map();let messageCache=[];
async function parseMessage(data){return JSON.parse(typeof data==='string'?data:await data.text())}function addLine(text,system=false){const line=document.createElement('div');line.className=`message${system?' system':''}`;line.textContent=text;messagesEl.appendChild(line);messagesEl.scrollTop=messagesEl.scrollHeight}function renderUsers(users,connected=[]){userList.innerHTML=users.map(user=>`<div class="user"><span class="dot"></span><span>${user}</span><small>${connected.includes(user)?'online':'simulated'}</small></div>`).join('')}
function renderMessage(message){const line=document.createElement('div');line.className='message';line.dataset.id=message.id;line.innerHTML=`<strong>${message.username}:</strong> ${message.text}<span class="receipt">sending</span>`;messagesEl.appendChild(line);receipts.set(message.id,line.querySelector('.receipt'));messagesEl.scrollTop=messagesEl.scrollHeight}
socket.onopen=()=>{socket.send(JSON.stringify({type:'join',username:usernameInput.value}));addLine('Connected. Five-user simulation is active.',true)};socket.onmessage=async event=>{const data=await parseMessage(event.data);if(data.type==='chat-snapshot'){renderUsers(data.users,data.connectedUsers);messageCache=data.messages;data.messages.forEach(renderMessage)}else if(data.type==='user-joined'){addLine(`${data.username} joined the room.`,true);if(![...userList.textContent].length)renderUsers([data.username])}else if(data.type==='typing'){typingEl.textContent=data.composing?`${data.username} is typing...`:''}else if(data.type==='chat-message'){renderMessage(data.message)}else if(data.type==='delivery-receipt'){const receipt=receipts.get(data.messageId);if(receipt&&data.status==='read')receipt.textContent='read';else if(receipt)receipt.textContent='delivered';}else if(data.type==='idle-notification'){noticeEl.textContent=data.text;setTimeout(()=>noticeEl.textContent='',4000)}else if(data.type==='system')addLine(data.text,true)};
function send(){const text=messageInput.value.trim();if(!text)return;socket.send(JSON.stringify({type:'message',text}));messageInput.value='';socket.send(JSON.stringify({type:'typing',composing:false}));}document.querySelector('#send').onclick=send;document.querySelector('#help').onclick=()=>socket.send(JSON.stringify({type:'help'}));messageInput.oninput=()=>socket.send(JSON.stringify({type:'typing',composing:messageInput.value.length>0}));messageInput.onkeydown=e=>{if(e.key==='Enter')send()};document.addEventListener('visibilitychange',()=>socket.send(JSON.stringify({type:'activity',active:!document.hidden})));
</script></body></html>
